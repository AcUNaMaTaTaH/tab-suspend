<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>💤 Suspended</title>
    <link id="favicon" rel="icon" href="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: system-ui, sans-serif;
            color: white;
            background: #121212;
        }

        body {
            display: grid;
            place-items: center;
        }

        #box {
            width: min(720px, calc(100vw - 32px));
            text-align: center;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 32px;
            box-sizing: border-box;
        }

        #pageTitle {
            max-width: 100%;
            margin: 0 0 22px;
            color: #cccccc;
            font-size: 22px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        h2 {
            margin: 0 0 20px;
            font-size: 18px;
            font-weight: 500;
        }

        a {
            color: #7dd3fc;
            font-size: 20px;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #shortcut {
            display: block;
            margin-top: 18px;
            color: #cccccc;
            font-size: 14px;
        }

        kbd {
            background: #444;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main id="box">
        <h1 id="pageTitle">Suspended</h1>

        <h2>This tab is suspended.</h2>

        <a id="restoreLink" href="#">Click to restore</a>

        <span id="shortcut">
            Press <kbd>Enter</kbd>, <kbd>Space</kbd>, or <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>S</kbd>
        </span>
    </main>

    <script src="suspended.js"></script>
</body>
</html>
